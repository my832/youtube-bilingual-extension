<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>youtube双语插件</title><link rel="stylesheet" href="ui.css"></head><body class="popup"><main><div class="eyebrow">YOUTUBE · BILINGUAL</div><h1>youtube双语插件</h1><p class="muted">看懂世界，也保留原声。</p><section><label class="toggle"><input id="enabled" type="checkbox">开启双语字幕</label><label for="provider">翻译服务</label><select id="provider"></select><label for="target">翻译成</label><select id="target"></select></section><section><h2>字幕外观</h2><div class="row"><div><label for="fontSize">原文字号 <span id="fontValue"></span></label><input id="fontSize" type="range" min="14" max="48" step="1"></div><div><label for="translationFontSize">译文字号 <span id="translationFontValue"></span></label><input id="translationFontSize" type="range" min="12" max="48" step="1"></div></div><label for="backgroundOpacity">背景不透明度 <span id="opacityValue"></span></label><input id="backgroundOpacity" type="range" min="0" max="100" step="1"><small>0% 完全透明 · 100% 完全不透明</small><label for="bottom">字幕距底部 <span id="bottomValue"></span></label><input id="bottom" type="range" min="5" max="45" step="1"><small>以上外观设置立即生效并自动保存。</small></section><div class="preview" id="preview"><div class="sample-line" id="previewOriginal">The world is full of stories.</div><div class="sample-line target" id="previewTranslation">世界充满了故事。</div></div><p id="message" role="status" aria-live="polite"></p><button id="options" class="secondary">API 与字幕设置</button><p><button id="statusButton" class="secondary">查看字幕预翻译状态</button></p><p id="diagnostics" class="foot" role="status"></p><p class="foot">v1.2.0 · 点击原文单词可查词。请开启视频 CC，并在 YouTube 中选择原文字幕。需要先配置翻译 API。</p></main><script type="module" src="popup.js"></script></body></html>
